 <h1 class=&quot;fs-24 mfs-18 proxima-bold&quot;>How do I get a box?</h1>
 <div class=&quot;fs-20 mfs-16&quot;>
 The secret to getting a box is to always <span class=&quot;proxima-bold c-primary&quot;>have at least <span class=&quot;show-for-planId1 sf-hidden&quot;>4</span><span class=&quot;show-for-planId2 sf-hidden&quot;>6</span><span class=&quot;show-for-planId3 sf-hidden&quot;>8</span><span class=&quot;show-for-planId5 sf-hidden&quot;>12</span><span class=&quot;show-for-planId7 sf-hidden&quot;>16</span><span class=&quot;show-for-planId10 sf-hidden&quot;>22</span> items in your closet</span>, but we recommend adding <span class=&quot;show-for-planId1 sf-hidden&quot;>8</span><span class=&quot;show-for-planId2 sf-hidden&quot;>10</span><span class=&quot;show-for-planId3 sf-hidden&quot;>12</span><span class=&quot;show-for-planId5 sf-hidden&quot;>16</span><span class=&quot;show-for-planId7 sf-hidden&quot;>20</span><span class=&quot;show-for-planId10 sf-hidden&quot;>26</span> or more. This way, you’re guaranteed to keep getting boxes. Your closet is unlimited, so add as many items as you want.
 </div>
 </div>
 <div class=&quot;large-6 columns&quot;>
 <div class=&quot;fs-20 mfs-16 c2&quot;>
 Need help filling up your closet? Check out <a href=https://aaronpruzaniec.github.io/a/clothing/new-arrivals>New Arrivals</a>, updated multiple times a week.
 <br>
 <br>Visit the <a href=https://aaronpruzaniec.github.io/pages/find-your-style>Find Your Style</a> page for inspiration and ideas.
 </div>
 </div>
 </div>
 </div>
 <div class=&quot;modal off&quot; id=modalPlacehold2>
 <div class=&quot;row modalCopyOuter hide&quot;>
 <div class=&quot;large-6 columns&quot;>
 <h1 class=&quot;fs-24 mfs-18 proxima-bold&quot;>When will I get my box?</h1>
 <div class=&quot;fs-20 mfs-16&quot;>
 After you've filled your closet, your <span class=&quot;proxima-bold c-primary&quot;>box will be automatically shipped</span> via Priority Mail. You’ll receive a shipping confirmation email with your tracking number. 
 </div>
 </div>
 <div class=&quot;large-6 columns&quot;>
 <div class=&quot;fs-20 mfs-16 c2&quot;>
 Need help filling up your closet? Check out <a href=https://aaronpruzaniec.github.io/a/clothing/new-arrivals>New Arrivals</a>, updated multiple times a week.
 <br>
 You can also <span class=&quot;proxima-bold c-primary&quot;>check the status</span> by clicking <a href=https://aaronpruzaniec.github.io/pages/closet-main>‘Track Package’</a> in the <span class=nobreak>At-Home</span> section of your closet. On average, shipments take 3-4 business days to arrive.
 </div>
 </div>
 </div>
 </div>
 <div class=&quot;modal off&quot; id=modalPlacehold3>
 <div class=&quot;row modalCopyOuter hide&quot;>
 <div class=&quot;large-6 columns&quot;>
 <h1 class=&quot;fs-24 mfs-18 proxima-bold&quot;>My box arrived! Now what?</h1>
 <div class=&quot;fs-20 mfs-16&quot;>
 Try everything on and experience it for as long as you want! Not the right fit? <span class=&quot;proxima-bold c-primary&quot;>Provide feedback when you Return Notify.</span> Plus, update your settings in our <span class=nw><a href=https://aaronpruzaniec.github.io/pages/size-advisor id=HIW_saLink>Size Advisor</a> tool.</span>
 </div>
 </div>
 <div class=&quot;large-6 columns&quot;>
 <div class=&quot;fs-20 mfs-16 c2&quot;>
 You can also learn about fit and more from our <a href=https://aaronpruzaniec.github.io/pages/size-charts id=HIW_scLink>size charts</a> and by reading member-written reviews on every item. Help out the next person by leaving a review of your own.
 </div>
 </div>
 </div>
 </div>
 <div class=&quot;modal off&quot; id=modalPlacehold4>
 <div class=&quot;row modalCopyOuter hide&quot;>
 <div class=&quot;large-6 columns&quot;>
 <h1 class=&quot;fs-24 mfs-18 proxima-bold&quot;>Do I have to send it back?</h1>
 <div class=&quot;fs-20 mfs-16&quot;>
 You've lived your life in it—so buy it if you love it! If not, it's easy to return. <span class=&quot;proxima-bold c-primary&quot;>Use Return Notify to get your next box about 2 days faster.</span> Then, simply drop your pre-paid bag in a USPS mailbox, your mailbox at home or work, or give it to your postal carrier.
 </div>
 </div>
 <div class=&quot;large-6 columns&quot;>
 <div class=&quot;fs-20 mfs-16 c2&quot;>
 <span class=&quot;proxima-bold c-primary&quot;>As a bonus, new members get 20% off their first purchase.</span> Check out all the ways you can <a href=https://aaronpruzaniec.github.io/pages/ways-to-buy id=HIW_wtbLink>shop better with us</a>.
