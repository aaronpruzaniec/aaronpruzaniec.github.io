 <h1>EOBR is happening now.</h1>
 <h2>Be ready with the simple, affordable, all-in-one solution: <br>VDO RoadLog™ Electronic On Board Recorder</h2>
 </div>
 <div class=column style=float:left>
 <p>The simple, affordable, all-in-one solution for daily log book and compliance reporting.</p>
 <p>Cost-effective HOS monitoring, that you can have up and running in minutes.</p>
 
 <ul>
 <li>Automated electronic recording of daily log book data </li>
 <li>Built-in-printer for rapid roadside checks</li>
 <li>Records data for Hours-of-Service (HOS), Vehicle Inspection and Repair Maintenance (DVIR), International Fuel Tax Agreement (IFTA) and International Registration Plan (IRP)</li>
 </ul>
 
 </div>
 <div class=column style=float:right>
 <ul>
 <li>No monthly fees and no smart phone required</li>
 <li>Plug and play installation and easy portability</li>
 <li>Easy data transfer from USB (wireless transfer optional)</li>
 <li>FMCSA compliant</li>
 </ul>
 <p>Learn more about RoadLog features:
 <br><a class=go href=http://www.roadlog.vdo.com/generator/www/us/en/vdo/roadlog/roadlog_features/index_roadlog_features_en.html>Go</a></p>
 <p></p>
 <p>Watch the RoadLog demo video:
 <br><a class=go href=https://aaronpruzaniec.github.io/vdoroadlog/video.php>Go</a></p>
